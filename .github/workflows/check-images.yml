name: Képhivatkozások ellenőrzése

on:
  push:
  pull_request:

jobs:
  check-images:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Check local image references
        run: ruby scripts/check_images.rb
