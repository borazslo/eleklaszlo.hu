name: Képhivatkozások ellenőrzése

on:
  push:
  pull_request:

jobs:
  check-images:
    name: Helyi képek
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Check local image references
        run: ruby scripts/check_images.rb

  check-external-images:
    name: Külső képek
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Check external image references
        run: ruby scripts/check_external_images.rb
