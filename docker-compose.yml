services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleklaszlo-web
    ports:
      - "5001:80"
    restart: unless-stopped
    networks:
      - default
      - ignacio-simple-server_default
    environment:
      - TZ=Europe/Budapest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
  ignacio-simple-server_default:
    external: true
